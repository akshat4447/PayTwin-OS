[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paytwin-api"
version = "0.1.0"
description = "PayTwin OS API: REST/SSE, policy engine, executor, commander, worker"
requires-python = ">=3.11"
dependencies = [
  "paytwin-contracts",
  "paytwin-sim",
  "paytwin-ml",
  "fastapi>=0.110,<1.0",
  "uvicorn[standard]>=0.29,<1.0",
  "sqlalchemy>=2.0,<2.2",
  "alembic>=1.13,<2.0",
  "pydantic>=2,<3",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3.1,<4",
  "httpx>=0.27,<1.0",
  "pyyaml>=6,<7",
]

[tool.setuptools.packages.find]
include = ["paytwin_api*"]
