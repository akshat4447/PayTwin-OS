/* =====================================================================
   PayTwin DS v3 — command-grade design system
   Native single-file implementation fusing shadcn/ui token architecture,

:root{
  --bg:#090a0f;--bg2:#0d0f16;--panel:#10131b;--panel2:#151926;--panel3:#1c2233;
  --line:#1f2534;--line2:#2c3448;
  --ink:#f3f5fa;--mut:#9aa3b8;--dim:#626c82;
  --acc:#5b6ef5;--acc2:#9079f5;
  --grn:#3ecf8e;--amb:#f5a524;--red:#f04e5e;--cyan:#43c6dd;--pink:#ee6dd5;
  --r:12px;--rs:8px;--r-lg:16px;
  --sh-sm:0 1px 2px rgba(3,5,12,.4);
  --sh:0 8px 28px rgba(3,5,12,.42);
  --sh-lg:0 24px 70px rgba(3,5,12,.6);
  --ease:cubic-bezier(.22,.8,.26,.99);
  --t-fast:140ms;--t:220ms;--t-slow:340ms;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:dark}
[data-theme="light"]{
  --bg:#f5f6f9;--bg2:#eef0f5;--panel:#ffffff;--panel2:#f4f6fa;--panel3:#eaeef5;
  --line:#e4e8f0;--line2:#d2d9e5;
  --ink:#161a26;--mut:#5b6579;--dim:#8d97ac;
  --acc:#4c61e8;--acc2:#7a5af8;
  --grn:#0ea472;--amb:#c47f17;--red:#dd3d52;--cyan:#0e8fa8;--pink:#c339b8;
  --sh-sm:0 1px 2px rgba(22,28,45,.06);
  --sh:0 8px 24px rgba(22,28,45,.09);
  --sh-lg:0 24px 64px rgba(22,28,45,.16);
  color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.55;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 420px at 85% -8%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 62%),radial-gradient(700px 360px at -6% 104%,color-mix(in srgb,var(--acc2) 7%,transparent),transparent 60%)}

button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;font-size:13px}

::-webkit-scrollbar-track{background:transparent}

.mono{font-family:var(--mono)}

.app{display:grid;grid-template-columns:250px 1fr;height:100vh;position:relative;z-index:1}
.sidebar{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;overflow-y:auto;overflow-x:hidden}

.iconbtn:hover{color:var(--ink);background:var(--panel2);border-color:var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--rs);font-weight:600;font-size:12.5px;border:1px solid var(--line2);background:var(--panel2);color:var(--ink);white-space:nowrap;transition:background var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease),filter var(--t-fast) var(--ease)}
.btn:hover{background:var(--panel3);border-color:color-mix(in srgb,var(--line2) 65%,var(--mut))}

/* Escape-then-format Markdown: hostile API/LLM output can never inject HTML. */
function mdSafe(s){s=String(s==null?'':s);
  s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
     .replace(/`([^`]+)`/g,'<code>$1</code>')
     .replace(/^###?\s?(.+)$/gm,'<b>$1</b>')
     .replace(/\n/g,'<br>');
  return s}

/* LIVE telemetry: consume the real SSE endpoint (commit-ordered, per-org).
   EventSource cannot send Authorization headers, so stream over fetch. */
function startStream(){
  fetch('/api/stream',{headers:H}).then(function(r){
    if(!r.ok||!r.body)throw new Error('sse '+r.status);
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
    function pump(){
      rd.read().then(function(ch){
        if(ch.done)return;
        buf+=dec.decode(ch.value,{stream:true});
        var frames=buf.split('\n\n');buf=frames.pop();
        frames.forEach(function(f){
          var ev=null,data='';
          f.split('\n').forEach(function(line){
            if(line.indexOf('event:')===0)ev=line.slice(6).trim();
            else if(line.indexOf('data:')===0)data+=line.slice(5).trim()});
          if(!ev||ev==='heartbeat'||!data)return;
          try{var p=JSON.parse(data);
            if(p.payment_ref||p.status){
              STREAM.unshift({t:nowT(),
                m:(p.merchant_id&&MERCH[p.merchant_id])?p.merchant_id:(ORG.merchants[0]||'mgro'),
                x:(p.event||'payment.updated')+' '+(p.payment_ref||'')+' → '+p.status});
              if(STREAM.length>9)STREAM.pop()}
          }catch(e2){}
        });
        var s=document.querySelector('[data-live=stream]');
        if(s)s.innerHTML=streamRows();
        pump();
      }).catch(function(){});
    }
    pump();
  }).catch(function(){/* SSE unavailable: periodic refresh still runs */});
}

<script id="ptds-selftest">
/* ===== Release self-test hook (?selftest=1) — CI greps PASS/FAIL from the DOM.
   Exercises the historically-crashing flows in-page. No-op without the flag. ===== */
(function(){
'use strict';
if(new URLSearchParams(location.search).get('selftest')!=='1')return;
var out=[];
function check(name,fn){try{fn();out.push('PASS '+name)}catch(e){out.push('FAIL '+name+' :: '+e.message)}}
function run(){
  check('reliability-route-mapped',function(){
    if(!PAGES.reliability)throw new Error('reliability missing from PAGES');
    S.page='reliability';render();
    var h=document.querySelector('.page h1');
    if(!h||!/reliability/i.test(h.textContent))throw new Error('reliability fell back: '+(h&&h.textContent));});
  check('merchant-card-click-no-crash',function(){
    S.page='merchants';render();
    var card=document.querySelector('[data-act="scope"][data-scope]');
    if(!card)throw new Error('no merchant card');
    card.click(); // data-scope handler: pre-fix this crashed on MERCH[undefined]
    if(!document.querySelector('.page'))throw new Error('page vanished after click');});
  check('warroom-zero-incidents-renders',function(){
    var bak=INC.slice();INC.length=0;S.inc=0;
    var html=pgWar();INC.push.apply(INC,bak);
    if(!/No incidents/.test(html))throw new Error('empty state missing');});
  check('warroom-empty-causes-renders',function(){
    var inc=INC[0]||{id:'T',sev:'P2',title:'t',merch:'mgro',cohort:'c',state:'DETECTED',det:'x',risk:0,ev:[],cands:[],budget:{}};
    var bak=inc.causes;inc.causes=[];
    var html=pgWar();inc.causes=bak;
    if(!/ranked edges yet|Causal evidence/.test(html))throw new Error('causes guard missing');});
  check('mdsafe-escapes-html',function(){
    var s=mdSafe('<img src=x onerror=alert(1)>**bold**');
    if(/[<]img/.test(s))throw new Error('raw HTML survived: '+s);
    if(!/[<]b[>]bold/.test(s))throw new Error('markdown formatting lost');});
  check('key-not-persisted',function(){
    if(localStorage.getItem('paytwin_api_key'))throw new Error('key found in localStorage');
    if(/[?&]key=/.test(location.search))throw new Error('?key= still in URL');});
  var d=document.createElement('pre');d.id='ptds-selftest-out';
  d.style.cssText='position:fixed;bottom:0;left:0;z-index:99999;background:#000;color:#0f0;font-size:11px;padding:6px;margin:0';
  d.textContent=out.join('\n');document.body.appendChild(d);
}
function when(ready){var t=setInterval(function(){
  if(ready()){clearInterval(t);run()}},50);
  setTimeout(function(){clearInterval(t);if(!document.getElementById('ptds-selftest-out'))run()},5000)}
when(function(){return document.querySelector('.page')});
})();
</script>

<script id="reliability-app-js">
/* ===== Reliability Lab behavior · additive (data + actions) ===== */
(function(){
'use strict';
function key(){var qs=new URLSearchParams(location.search).get('key');
  return qs||localStorage.getItem('paytwin_api_key')||''}
function api(path,opt){opt=opt||{};var k=key();if(!k)return Promise.reject(new Error('no key'));
  var h={'Authorization':'Bearer '+k};
  if(opt.body)h['Content-Type']='application/json';
  return fetch(path,{method:opt.method||'GET',headers:h,
    body:opt.body?JSON.stringify(opt.body):undefined})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r.json()})}

function ensureState(){if(!S.rel)S.rel={loaded:false,live:false,ov:null,
  suites:[],findings:[],running:false,lastFault:null}}
function load(){
  ensureState();
  console.log('RELDBG load enter · loaded='+S.rel.loaded+' loading='+S.rel.loading+' live='+S.rel.live+' key='+(!!key()));
  if(S.rel.loaded||S.rel.loading||!key())return;
  S.rel.loading=true;
  console.log('RELDBG fetching…');
  Promise.all([api('/api/reliability/overview'),api('/api/reliability/suites'),
               api('/api/reliability/findings')])
   .then(function(rs){
     console.log('RELDBG fetched · suites='+rs[1].suites.length);
     S.rel.ov=rs[0];S.rel.suites=rs[1].suites;S.rel.findings=rs[2].findings;
     S.rel.live=true;S.rel.loading=false;S.rel.loaded=true;render()})
   .catch(function(e){
     // Any load failure is terminal for this session — the connect card
     // takes over, preventing infinite retry loops against a rotated key.
     S.rel.loaded=true;S.rel.live=false;S.rel.loading=false;
     console.log('RELLAB load failed: '+e);
     render()})}
var _rlRender=window.render;
window.render=function(){_rlRender();
  if(S.page==='reliability')setTimeout(load,0)};
if(S.page==='reliability')setTimeout(load,80);   // first open via #reliability

  if(location.hash.slice(1)==='reliability')setTimeout(load,80)});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act="relrun"],[data-act="relwh"]');
  if(!el)return;
  e.stopImmediatePropagation();
  ensureState();

        body:packs?{packs:packs}:{}})
     .then(function(run){S.rel.running=false;
       if(S.rel.ov)S.rel.ov.gate=run.gate;
       S.rel.findings=run.findings;
       toast('Reliability run '+run.run_id+' · gate '
             +run.gate.verdict+' ('+run.gate.score+'/100)');
       render()})
     .catch(function(){S.rel.running=false;render();
       toast('Reliability API unreachable')});
  }else{
    api('/api/reliability/webhook-lab/'+el.dataset.k,{method:'POST'})
     .then(function(r){S.rel.lastFault=r;render();
       toast('Injected · '+r.note+(Object.keys(r.invariant_violations).length?
             ' · INVARIANTS VIOLATED':' · invariants held'))})
     .catch(function(){toast('Webhook Lab unreachable')});
  }
},true);
})();
