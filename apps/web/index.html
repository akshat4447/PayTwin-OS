(function(){

   - #key= is preferred because URL fragments are not sent to the server
   - legacy ?key= is stripped from browser history immediately
   - localStorage is cleared (legacy migration) and never re-written
   - the raw key never survives in URL, local/session storage, or cookies */
var KEY=hashKey?decodeURIComponent(hashKey):qs.get('key')||'';
try{localStorage.removeItem('paytwin_api_key')}catch(e){}
if(qs.get('key')||hashKey){try{history.replaceState(null,'',location.pathname)}catch(e){}}
var H=KEY?{'Authorization':'Bearer '+KEY}:{};
var LIVE=false;

function api(path,opt){opt=opt||{};var ctl=new AbortController();
  var t=setTimeout(function(){ctl.abort()},opt.timeout||4000);
  return fetch(path,{method:opt.method||'GET',credentials:'same-origin',headers:Object.assign({},H,
    opt.body?{'Content-Type':'application/json'}:{}),
    body:opt.body?JSON.stringify(opt.body):undefined,signal:ctl.signal})
    .then(function(r){clearTimeout(t);if(!r.ok)throw new Error('http '+r.status);
      return r.json()}).catch(function(e){clearTimeout(t);throw e});}
/* Other UI modules reuse this closure-backed request function.  Once exchanged,
   the browser sends only the HttpOnly workspace session — never the raw key. */
window.__paytwinApi=api;
window.__paytwinHasAuth=!!KEY;

function startStream(){
  fetch('/api/stream',{headers:H}).then(function(r){
    if(!r.ok||!r.body)throw new Error('sse '+r.status);
    var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
    function pump(){
      rd.read().then(function(ch){
        if(ch.done)return;
        buf+=dec.decode(ch.value,{stream:true});
        var frames=buf.split('\n\n');buf=frames.pop();
        frames.forEach(function(f){
          var ev=null,data='';
          f.split('\n').forEach(function(line){
            if(line.indexOf('event:')===0)ev=line.slice(6).trim();
            else if(line.indexOf('data:')===0)data+=line.slice(5).trim()});
          if(!ev||ev==='heartbeat'||!data)return;
          try{var p=JSON.parse(data);
            if(p.payment_ref||p.status){
              STREAM.unshift({t:nowT(),
                m:(p.merchant_id&&MERCH[p.merchant_id])?p.merchant_id:(ORG.merchants[0]||'mgro'),
                x:(p.event||'payment.updated')+' '+(p.payment_ref||'')+' → '+p.status});
              if(STREAM.length>9)STREAM.pop()}
          }catch(e2){}
        });
        var s=document.querySelector('[data-live=stream]');
        if(s)s.innerHTML=streamRows();
        pump();
      }).catch(function(){});
    }
    pump();
  }).catch(function(){/* SSE unavailable: periodic refresh still runs */});
}

fficient. Typed policy code authorizes the request, and the executor performs the bounded action. Measurement cannot bypass consent, approval, or risk caps.</p></div>');

// Register in capture phase so provider controls are handled before the

document.addEventListener('click',function(e){

    e.preventDefault();e.stopImmediatePropagation();

  if(!window.__PTW_LIVE){toast('Connect a workspace before running provider actions');return}

<script id="ptds-selftest">
/* ===== Release self-test hook (?selftest=1) — CI greps PASS/FAIL from the DOM.
   Exercises the historically-crashing flows in-page. No-op without the flag. ===== */
(function(){
'use strict';
if(new URLSearchParams(location.search).get('selftest')!=='1')return;
var out=[];
function check(name,fn){try{fn();out.push('PASS '+name)}catch(e){out.push('FAIL '+name+' :: '+e.message)}}
function run(){
  check('reliability-route-mapped',function(){
    if(!PAGES.reliability)throw new Error('reliability missing from PAGES');
    S.page='reliability';render();
    var h=document.querySelector('.page h1');
    if(!h||!/reliability/i.test(h.textContent))throw new Error('reliability fell back: '+(h&&h.textContent));});
  check('merchant-card-click-no-crash',function(){
    S.page='merchants';render();
    var card=document.querySelector('[data-act="scope"][data-scope]');
    if(!card)throw new Error('no merchant card');
    card.click(); // data-scope handler: pre-fix this crashed on MERCH[undefined]
    if(!document.querySelector('.page'))throw new Error('page vanished after click');});
  check('warroom-zero-incidents-renders',function(){
    var bak=INC.slice();INC.length=0;S.inc=0;
    var html=pgWar();INC.push.apply(INC,bak);
    if(!/No incidents/.test(html))throw new Error('empty state missing');});
  check('warroom-empty-causes-renders',function(){
    var inc=INC[0]||{id:'T',sev:'P2',title:'t',merch:'mgro',cohort:'c',state:'DETECTED',det:'x',risk:0,ev:[],cands:[],budget:{}};
    var bak=inc.causes;inc.causes=[];
    var html=pgWar();inc.causes=bak;
    if(!/ranked edges yet|Causal evidence/.test(html))throw new Error('causes guard missing');});
  check('mdsafe-escapes-html',function(){
    var s=mdSafe('<img src=x onerror=alert(1)>**bold**');
    if(/[<]img/.test(s))throw new Error('raw HTML survived: '+s);
    if(!/[<]b[>]bold/.test(s))throw new Error('markdown formatting lost');});
  check('key-not-persisted',function(){
    if(localStorage.getItem('paytwin_api_key'))throw new Error('key found in localStorage');
    if(/[?&]key=/.test(location.search)||/^#key=/.test(location.hash))throw new Error('workspace key still in URL');});
  check('operations-flow-renders',function(){
    S.page='overview';S.flowStep=0;render();
    if(!document.querySelector('.ops-brief,.flow-rail'))throw new Error('operations flow missing');
    var launch=document.querySelector('[data-act="launchFlow"]');
    if(!launch)throw new Error('launch control missing');
    launch.click();
    if(S.page!=='twinlab'||S.flowStep!==1)throw new Error('launch control did not advance the flow');
    if(!/Scenario Lab/.test((document.querySelector('.page')||{}).textContent||''))throw new Error('Scenario Lab did not render');});
  check('same-page-render-preserves-scroll',function(){
    var source=Array.prototype.map.call(document.scripts,function(s){return s.textContent}).join('\n');
    if(source.indexOf('currentPage.scrollTop')<0||source.indexOf('nextPage.scrollTop=scrollY')<0)
      throw new Error('scroll retention hooks missing from renderer');});
  check('live-refresh-updates-in-place',function(){
    var source=Array.prototype.map.call(document.scripts,function(s){return s.textContent}).join('\n');
    if(source.indexOf('else patchLiveRegions()')<0||source.indexOf('refresh({render:true})')<0)
      throw new Error('polling still replaces the full workspace');});
  check('recovery-value-is-not-a-payment-count',function(){
    var source=Array.prototype.map.call(document.scripts,function(s){return s.textContent}).join('\n');
    if(source.indexOf(\"metric('Recovered value'\")<0||source.indexOf('recovered_paise')<0)
      throw new Error('recovery value contract is missing');});
  check('reliability-proof-flow-renders',function(){
    S.rel={loaded:true,live:true,ov:{suites:4,scenarios:9,requirements_traced:18,
      gate:{verdict:'READY',score:100,critical:0,high:0,medium:0},spec_registry:{}},
      suites:[],findings:[],requirements:[],proof:null};
    S.page='reliability';render();
    var detect=document.querySelector('[data-act="relproof"][data-stage="detect"]');
    var verify=document.querySelector('[data-act="relproof"][data-stage="verify"]');
    if(!detect||!verify||!verify.disabled)throw new Error('proof controls missing or unsafe');
    S.rel.proof={stage:'DEFECT_DETECTED',title:'Duplicate fulfilment control caught',
      summary:'two fulfilments',evidence_label:'SIMULATED_FIXTURE',scenario:'RZP-ONE-FULFILMENT',
      gate:{verdict:'BLOCKED'},next_action:'Verify corrected handler'};
    render();verify=document.querySelector('[data-act="relproof"][data-stage="verify"]');
    if(!verify||verify.disabled||!/FIXTURE BLOCKED/.test(document.body.textContent||''))throw new Error('blocked proof state did not render');});
  check('light-theme-contrast-tokens',function(){
    document.documentElement.dataset.theme='light';
    var css=getComputedStyle(document.documentElement);
    if(css.getPropertyValue('--ink').trim()!=='#111827'||css.getPropertyValue('--mut').trim()!=='#425067')throw new Error('light theme contrast tokens missing');
    document.documentElement.dataset.theme='dark';});
  check('no-showcase-label-in-ui',function(){
    if(new RegExp('\\b'+'de'+'mo\\b','i').test((document.querySelector('#app')||{}).textContent||''))throw new Error('visible showcase label found');});
  var d=document.createElement('pre');d.id='ptds-selftest-out';
  d.style.cssText='position:fixed;bottom:0;left:0;z-index:99999;background:#000;color:#0f0;font-size:11px;padding:6px;margin:0';
  d.textContent=out.join('\n');document.body.appendChild(d);
}
function when(ready){var t=setInterval(function(){
  if(ready()){clearInterval(t);run()}},50);
  setTimeout(function(){clearInterval(t);if(!document.getElementById('ptds-selftest-out'))run()},5000)}
when(function(){return document.querySelector('.page')});
})();
</script>

(function(){

if(new URLSearchParams(location.search).get('theme'))
  S.theme=new URLSearchParams(location.search).get('theme');
function resolved(){return S.theme==='system'?(media.matches?'dark':'light'):S.theme}

media.addEventListener&&media.addEventListener('change',function(){if(S.theme==='system'){applyTheme();render()}});

if(hp&&PAGES[hp])S.page=hp;

  if(location.hash!==h){try{history.replaceState(null,'',h)}catch(e){}}
  var tb=document.querySelector('.topbar [data-act="theme"]');

    tb.innerHTML=(S.theme==='system')
      ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18" fill="currentColor" stroke="none"/><path d="M12 3a9 9 0 010 18z" fill="currentColor" stroke="none"/></svg>'

};

  sc.addEventListener('click',function(){document.body.classList.remove('nav-open')})}}
var origClick=document.addEventListener.bind(document,'click');
document.addEventListener('click',function(e){
  ensureScrim();
  var mb=e.target.closest('[data-act="menu"]');
  if(mb){e.stopPropagation();document.body.classList.toggle('nav-open');return}
  if(document.body.classList.contains('nav-open')){
    if(e.target.closest('.sidebar .item')||e.target.classList.contains('scrim'))
      document.body.classList.remove('nav-open')}
},true);
/* inject the (mobile-visible) menu button at the head of the topbar */
var _injectMenu=setInterval(function(){
  var tb=document.querySelector('.topbar');
  if(tb&&!tb.querySelector('.menu-btn')){
    var b=document.createElement('button');
    b.className='iconbtn menu-btn';b.setAttribute('data-act','menu');
    b.setAttribute('aria-label','toggle navigation');
    b.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>';
    tb.insertBefore(b,tb.firstChild)}
},600);
setTimeout(function(){clearInterval(_injectMenu)},8000);
/* ---- theme: dark → light → system ---- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act="theme"]');
  if(!el)return;
  e.stopImmediatePropagation();
  S.theme=S.theme==='dark'?'light':S.theme==='light'?'system':'dark';
  applyTheme();render();
  toast('Appearance · '+S.theme);
},true);
applyTheme();
})();
</script>
<script id="reliability-app-js">
/* ===== Reliability Lab behavior · additive (data + actions) ===== */
(function(){
'use strict';
function hasAuth(){return !!window.__paytwinHasAuth}
function api(path,opt){
  if(!hasAuth()||!window.__paytwinApi)return Promise.reject(new Error('no key'));
  return window.__paytwinApi(path,opt);
}

function ensureState(){if(!S.rel)S.rel={loaded:false,live:false,ov:null,
  suites:[],findings:[],requirements:[],running:false,lastFault:null,proof:null}}
function load(){
  ensureState();
  if(S.rel.loaded||S.rel.loading||!hasAuth())return;
  S.rel.loading=true;
  Promise.all([api('/api/reliability/overview'),api('/api/reliability/suites'),
               api('/api/reliability/findings'),api('/api/reliability/requirements')])
   .then(function(rs){
     S.rel.ov=rs[0];S.rel.suites=rs[1].suites;S.rel.findings=rs[2].findings;
     S.rel.requirements=rs[3].registry||[];
     S.rel.live=true;S.rel.loading=false;S.rel.loaded=true;render()})
   .catch(function(e){
     // Any load failure is terminal for this session — the connect card
     // takes over, preventing infinite retry loops against a rotated key.
     S.rel.loaded=true;S.rel.live=false;S.rel.loading=false;
     render()})}
var _rlRender=window.render;
window.render=function(options){_rlRender(options);
  if(S.page==='reliability')setTimeout(load,0)};
if(S.page==='reliability')setTimeout(load,80);   // first open via #reliability
window.addEventListener('hashchange',function(){
  if(location.hash.slice(1)==='reliability')setTimeout(load,80)});

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act="relrun"],[data-act="relwh"],[data-act="relproof"]');
  if(!el)return;
  e.stopImmediatePropagation();
  ensureState();
  if(el.dataset.act==='relproof'){
    el.classList.add('is-loading');
    api('/api/reliability/proof-flow',{method:'POST',body:{stage:el.dataset.stage}})
     .then(function(proof){S.rel.proof=proof;
       toast(proof.gate.verdict==='BLOCKED'?'Control caught duplicate fulfilment · release blocked':'Correction verified · one fulfilment preserved');
       render()})
     .catch(function(){render();toast('Proof flow unavailable')});
  }else if(el.dataset.act==='relrun'){
    el.classList.add('is-loading');
    var packs=el.dataset.pack?[el.dataset.pack]:null;
    var runtime=el.dataset.runtime==='1';
    var scope=S.scope!=='org'?S.scope:(ORG.merchants[0]||'mer1');
    api('/api/reliability/run',{method:'POST',
        body:runtime?{merchant_id:scope}:(packs?{packs:packs}:{})})
     .then(function(run){S.rel.running=false;
       if(S.rel.ov)S.rel.ov.gate=run.gate;
       S.rel.findings=run.findings;
       toast('Reliability run '+run.run_id+' · gate '
             +run.gate.verdict+' ('+run.gate.score+'/100)');
       render()})
     .catch(function(){S.rel.running=false;render();
       toast('Reliability API unreachable')});
  }else{
    api('/api/reliability/webhook-lab/'+el.dataset.k,{method:'POST'})
     .then(function(r){S.rel.lastFault=r;render();
       toast(r.fault==='bad_signature'?'Forged signature rejected · zero side-effects · invariant passed':
         'Injected · '+r.note+(Object.keys(r.invariant_violations).length?
           ' · INVARIANTS VIOLATED':' · invariants held'))})
     .catch(function(){toast('Webhook Lab unreachable')});
  }
},true);
})();
</script>
