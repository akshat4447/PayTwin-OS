[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paytwin-sim"
version = "0.1.0"
description = "PayTwin OS payment simulator: seeded world, incident injection, emitter"
requires-python = ">=3.11"
dependencies = ["paytwin-contracts"]

[tool.setuptools.packages.find]
include = ["paytwin_sim*"]
