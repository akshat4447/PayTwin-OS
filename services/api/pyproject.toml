[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paytwin-api"
version = "0.1.0"
description = "PayTwin OS API: REST/SSE, policy engine, executor, commander, worker"
requires-python = ">=3.11"
dependencies = [
  "paytwin-contracts",
  "paytwin-sim",
  "paytwin-ml",
  "fastapi>=0.110",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2",
  "pydantic-settings>=2",
  "psycopg[binary]",
  "httpx",
  "pyyaml",
]

[tool.setuptools.packages.find]
include = ["paytwin_api*"]
