[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paytwin-contracts"
version = "0.1.0"
description = "PayTwin OS canonical contracts: events, enums, money"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
include = ["paytwin_contracts*"]
